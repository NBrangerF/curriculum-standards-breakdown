  <script>
    // Keep campaign attribution while excluding searches and other URL parameters.
    window.kebiaoAnalyticsBeforeSend = function(type, payload) {
      if (typeof payload.url !== "string") return payload;
      try {
        var url = new URL(payload.url, window.location.origin);
        var current = new URL(window.location.href);
        url.search = "";
        url.hash = "";
        if (url.pathname === current.pathname) {
          ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term"].forEach(function(key) {
            var value = current.searchParams.get(key);
            if (value) url.searchParams.set(key, value.slice(0, 200));
          });
        }
        return Object.assign({}, payload, { url: url.toString() });
      } catch (_) {
        return false;
      }
    };
  </script>

    defer

    data-exclude-search="true"

    data-before-send="kebiaoAnalyticsBeforeSend"
